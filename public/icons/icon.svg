<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Card Background Gradient: Dark neutral-900 glass backdrop -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242429"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0e0e11"/>
    </linearGradient>

    <!-- Glass Surface Inner Reflection -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Top-Left Corner Gradient Stroke: heavier on edges/corners, lighter on the sides -->
    <radialGradient id="tlGrad" cx="0" cy="0" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Bottom-Right Corner Gradient Stroke: heavier on edges/corners, lighter on the sides -->
    <radialGradient id="brGrad" cx="512" cy="512" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Full 512x512 background card with rounded="lg" radius (rx="64") -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="64" fill="url(#glassReflection)"/>
  
  <!-- Base card outline border (GlassCard variant="dark") -->
  <rect x="3" y="3" width="506" height="506" rx="61" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Top-Left Corner Stroke (rounded="lg" arc, heavier on corner edge, lighter on sides) -->
  <path d="M 256 4 L 68 4 A 64 64 0 0 0 4 68 L 4 256"
        fill="none"
        stroke="url(#tlGrad)"
        stroke-width="6"
        stroke-linecap="round"/>

  <!-- Bottom-Right Corner Stroke (rounded="lg" arc, heavier on corner edge, lighter on sides) -->
  <path d="M 256 508 L 444 508 A 64 64 0 0 0 508 444 L 508 256"
        fill="none"
        stroke="url(#brGrad)"
        stroke-width="6"
        stroke-linecap="round"/>

  <!-- Wallet Icon (Lucide Wallet centered in white) -->
  <g transform="translate(128, 128) scale(10.67)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
  </g>
</svg>