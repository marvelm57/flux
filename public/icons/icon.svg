<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Card Background Gradient: Dark neutral-900 glass backdrop -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26262b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0e0e11"/>
    </linearGradient>

    <!-- Glass Surface Inner Reflection -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Top-Left Corner Gradient Stroke: heavier on edges/corners, lighter on the sides -->
    <radialGradient id="tlGrad" cx="32" cy="32" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Bottom-Right Corner Gradient Stroke: heavier on edges/corners, lighter on the sides -->
    <radialGradient id="brGrad" cx="480" cy="480" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded squircle card -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#glassReflection)"/>
  
  <!-- Base card outline border (GlassCard variant="dark") -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Top-Left Corner Stroke (covers ~half width & height along top-left corner, heavier on edge, lighter on sides) -->
  <path d="M 256 32 L 136 32 A 104 104 0 0 0 32 136 L 32 256"
        fill="none"
        stroke="url(#tlGrad)"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Bottom-Right Corner Stroke (covers ~half width & height along bottom-right corner, heavier on edge, lighter on sides) -->
  <path d="M 256 480 L 376 480 A 104 104 0 0 0 480 376 L 480 256"
        fill="none"
        stroke="url(#brGrad)"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Wallet Icon (Lucide Wallet centered in white) -->
  <g transform="translate(144, 144) scale(9.333)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
  </g>
</svg>